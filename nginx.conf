# Nginx Configuration for Pathfinders Club Website
# This configuration sets up Nginx as a reverse proxy for the Node.js backend
# and serves static frontend files

# Upstream configuration for Node.js backend
upstream pathfinders_backend {
    server localhost:5000;
    keepalive 64;
}

# HTTP server - redirects to HTTPS in production
server {
    listen 80;
    listen [::]:80;
    server_name pathfindersclub.org www.pathfindersclub.org;

    # For Let's Encrypt SSL certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment in production)
    # return 301 https://$server_name$request_uri;

    # For development, serve content directly
    root /var/www/pathfinders;
    index index.html;

    # Frontend static files
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy to Node.js backend
    location /api/ {
        proxy_pass http://pathfinders_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://pathfinders_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

# HTTPS server configuration (for production with SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pathfindersclub.org www.pathfindersclub.org;

    # SSL certificates (update paths to your certificate files)
    ssl_certificate /etc/letsencrypt/live/pathfindersclub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pathfindersclub.org/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (uncomment when SSL is working correctly)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

