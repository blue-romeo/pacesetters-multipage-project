<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photo gallery of Pathfinders Club activities, events, and adventures">
    <title>Gallery - Pathfinders Club</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏕️</text></svg>">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Photo Gallery</h1>
                <p>Capturing memories and moments from our adventures</p>
            </div>
        </section>

        <section class="section">
            <div class="container-wide">
                <h2 class="section-title">Recent Adventures</h2>
                
                <div class="gallery-grid">
                    <!-- Gallery images loaded dynamically from API -->
                    <div class="dynamic-loader" style="grid-column: 1/-1;">
                        <div class="loader-spinner"></div>
                        <p class="loader-text">Loading gallery images...</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
            <button class="lightbox-close" aria-label="Close lightbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <button class="lightbox-prev" aria-label="Previous image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <button class="lightbox-next" aria-label="Next image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
            <img id="lightbox-img" src="" alt="">
        </div>

        <section class="section section-gray">
            <div class="container text-center">
                <h2>Want to Be Part of Our Story?</h2>
                <p>Join us and create your own amazing memories!</p>
                <a href="contact.html" class="cta-button" style="margin-top: 2rem;">Join Today</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="api-config.js"></script>
    <script type="module" src="js/public/public-main.js"></script>
</body>
</html>
