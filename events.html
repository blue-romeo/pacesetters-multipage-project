<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upcoming Pathfinders Club events, activities, and calendar">
    <title>Events - Pathfinders Club</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏕️</text></svg>">
    
    <!-- Performance optimizations -->
    <script>
        const apiHost = ['localhost', '127.0.0.1', '::1'].includes(location.hostname) || location.protocol === 'file:' 
            ? 'http://localhost:5000' 
            : location.origin;
        document.write(`<link rel="preconnect" href="${apiHost}" crossorigin>`);
        document.write(`<link rel="dns-prefetch" href="${apiHost}">`);
    </script>
    <link rel="preload" href="css/main.css" as="style">
    <link rel="modulepreload" href="js/public/public-main.js">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Events & Activities</h1>
                <p>Join us for exciting adventures and meaningful experiences</p>
            </div>
        </section>

        <!-- Countdown to Next Event -->
        <section class="countdown-section">
            <div class="container">
                <h3>Next Event Starts In</h3>
                <div class="countdown-timer" id="countdown">
                    <div class="countdown-item">
                        <span class="countdown-value" id="days">00</span>
                        <span class="countdown-label">Days</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="hours">00</span>
                        <span class="countdown-label">Hours</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="minutes">00</span>
                        <span class="countdown-label">Minutes</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="seconds">00</span>
                        <span class="countdown-label">Seconds</span>
                    </div>
                </div>
                <p class="countdown-event">Loading next event...</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="event-filter">
                    <button class="filter-btn active" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="past">Past Events</button>
                </div>
                
                <div class="events-list">
                    <!-- Events loaded dynamically from API -->
                    <div class="dynamic-loader">
                        <div class="loader-spinner"></div>
                        <p class="loader-text">Loading events...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="cta-section">
            <div class="container">
                <h2>Want to Join These Adventures?</h2>
                <p>Become a Pathfinder and experience all our exciting events!</p>
                <div class="cta-buttons">
                    <a href="contact.html" class="cta-button">Apply Now</a>
                    <a href="about.html" class="cta-button-outline-white">Learn More</a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="api-config.js"></script>
    <script type="module" src="js/public/public-main.js"></script>
</body>
</html>
</html>
